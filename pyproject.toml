[project]
name = "parda"
version = "0.2.0"
description = "Reversible pseudonymisation of Indian personal data before it reaches an LLM, with a round-trip benchmark."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yash Sharma" }]
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
parda = "parda.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
